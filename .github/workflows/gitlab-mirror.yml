name: Mirror to GitLab

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: gitlab-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror branches and tags
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clone GitHub repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --mirror \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            source.git

      - name: Push branches and tags to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          git -C source.git push --prune \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/beyond-apex-group/beyondapex.com.au.git" \
            "+refs/heads/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"
